name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if printf '%s' "$HEAD_REF" | grep -qiE '^codex'; then
            echo "::error::PR branch '${HEAD_REF}' must not start with 'codex'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise (Node 24)
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Verify (diff check, astro check, build, static tests)
        run: mise run verify
